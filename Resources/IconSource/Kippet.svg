<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BC4B4"/>
      <stop offset="1" stop-color="#0A6466"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#FF9F2E"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="16" result="b"/>
      <feFlood flood-color="#04363A" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="10" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.28"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>

    <!-- back card -->
    <g transform="translate(470 470) rotate(-10)" filter="url(#shadow)">
      <rect x="-185" y="-235" width="370" height="470" rx="46" fill="#FFFFFF" fill-opacity="0.55"/>
    </g>
    <!-- front card -->
    <g transform="translate(505 480) rotate(4)" filter="url(#shadow)">
      <rect x="-185" y="-235" width="370" height="470" rx="46" fill="#FFFFFF"/>
      <rect x="-130" y="-165" width="190" height="30" rx="15" fill="#2BC4B4"/>
      <rect x="-130" y="-100" width="260" height="24" rx="12" fill="#D5ECE9"/>
      <rect x="-130" y="-52" width="220" height="24" rx="12" fill="#D5ECE9"/>
      <rect x="-130" y="-4" width="240" height="24" rx="12" fill="#D5ECE9"/>
    </g>

    <!-- string from tag to card -->
    <path d="M 610 628 C 560 560, 580 480, 632 452" fill="none" stroke="#0A5254" stroke-width="12" stroke-linecap="round"/>
    <circle cx="640" cy="448" r="17" fill="#FFFFFF" stroke="#0A5254" stroke-width="9"/>

    <!-- tag -->
    <g transform="translate(640 702) rotate(-18)" filter="url(#shadow)">
      <path d="M -100 -10 L -46 -78 L 46 -78 L 100 -10 L 100 140 L -100 140 Z"
            fill="url(#tag)" stroke="url(#tag)" stroke-width="36" stroke-linejoin="round"/>
      <circle cx="0" cy="-38" r="20" fill="#FFF6E4" stroke="#D97A12" stroke-width="9"/>
      <path d="M -40 14 L -40 122 M 40 14 L -38 76 M -8 52 L 46 122" fill="none" stroke="#7A3F00" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
